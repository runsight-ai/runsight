[project]
name = "runsight-workspace"
version = "0.5.4"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "codebones>=0.5.0",
    "pydantic-settings>=2.13.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.8",
    "sqlmodel>=0.0.37",
    "structlog>=25.5.0",
]

[tool.uv.workspace]
members = ["apps/api", "packages/core"]

[tool.uv.sources]
runsight-core = { workspace = true }
runsight = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/core/tests", "tools/tests"]
asyncio_mode = "auto"
# Pytest is single-process by default. Keep broad accidental runs bounded:
# stop on first failure and disable xdist worker fan-out if the plugin is present.
addopts = "--maxfail=1 -p no:xdist"
markers = [
    "integration: requires tmux and/or agent CLIs",
    "e2e: full system end-to-end tests",
    "future_backlog: tests for future phases (Phase 1.1+)",
    "governance: static or policy tests that enforce repository boundaries",
    "migration: temporary compatibility or cleanup tests with an explicit exit path",
    "real_subprocess_isolation: tests that must exercise the real core subprocess isolation boundary",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/test_openapi_codegen.py" = ["F401"]
