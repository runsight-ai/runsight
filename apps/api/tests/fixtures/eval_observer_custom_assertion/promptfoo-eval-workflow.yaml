id: promptfoo-eval-workflow
kind: workflow
version: "1.0"
config:
  model_name: gpt-4o
souls:
  analyst:
    id: analyst
    kind: soul
    name: Analyst
    role: Analyst
    system_prompt: You are a careful analyst.
    provider: openai
    model_name: gpt-4o
blocks:
  analyze:
    type: linear
    soul_ref: analyst
    assertions:
      - type: custom:tone_check
        config:
          prefix: calm
      - type: contains
        value: "calm"
workflow:
  name: promptfoo_eval_live_path
  entry: analyze
  transitions:
    - from: analyze
      to: null
