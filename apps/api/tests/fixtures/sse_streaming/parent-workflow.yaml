id: parent-workflow
kind: workflow
version: "1.0"
config:
  model_name: gpt-4o
souls:
  planner:
    id: planner
    kind: soul
    name: Planner
    role: Planner
    system_prompt: You are a planner.
    provider: openai
    model_name: gpt-4o
blocks:
  plan:
    type: linear
    soul_ref: planner
  delegate:
    type: workflow
    workflow_ref: child-workflow
workflow:
  name: parent_sse_test
  entry: plan
  transitions:
    - from: plan
      to: delegate
    - from: delegate
      to: null
