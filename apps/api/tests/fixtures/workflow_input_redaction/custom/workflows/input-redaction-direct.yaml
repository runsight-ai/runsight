id: input-redaction-direct
kind: workflow
version: "1.0"
inputs:
  query:
    type: string
  limit:
    type: number
    required: false
    default: 5
  api_token:
    type: string
    sensitive: true
blocks:
  expose:
    type: code
    timeout_seconds: 5
    inputs:
      query:
        from: workflow.query
      token:
        from: workflow.api_token
    code: |
      import time
      def main(data):
          time.sleep(0.25)
          return {"ok": True, "echoed_token": data["token"]}
workflow:
  name: input_redaction_direct
  entry: expose
  transitions:
    - from: expose
      to: null
