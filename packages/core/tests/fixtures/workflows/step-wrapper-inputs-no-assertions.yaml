id: input-only-step-workflow
kind: workflow
version: "1.0"
blocks:
  fetch:
    type: linear
    soul_ref: researcher
  analyze:
    type: linear
    soul_ref: analyst
    inputs:
      data:
        from: fetch.output
workflow:
  name: inputs_no_assertions
  entry: fetch
  transitions:
    - from: fetch
      to: analyze
    - from: analyze
      to: null
