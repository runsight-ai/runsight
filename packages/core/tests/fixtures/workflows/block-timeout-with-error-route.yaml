version: "1.0"
id: block-timeout-with-error-route-workflow
kind: workflow
souls:
  timeout-worker:
    id: timeout-worker
    kind: soul
    name: Timeout Worker
    role: Timeout Worker
    system_prompt: Execute the timeout fixture block.
    provider: fixture-provider
    model_name: fixture-workflow-limit-model
blocks:
  slow_block:
    type: linear
    soul_ref: timeout-worker
    limits:
      max_duration_seconds: 1
    error_route: fallback
  fallback:
    type: linear
    soul_ref: timeout-worker
workflow:
  name: block_timeout_with_error_route_workflow
  entry: slow_block
  transitions:
    - from: slow_block
      to: null
    - from: fallback
      to: null
