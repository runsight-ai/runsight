version: "1.0"
id: terminal-block-cost-cap
kind: workflow
souls:
  budget-worker:
    id: budget-worker
    kind: soul
    name: Budget Worker
    role: Budget Worker
    system_prompt: Run the terminal budget block.
    provider: fixture-provider
    model_name: fixture-cost-cap-model
blocks:
  terminal_budget_block:
    type: linear
    soul_ref: budget-worker
    limits:
      cost_cap_usd: 0.001
      on_exceed: fail
    error_route: fallback_budget_recovery
  fallback_budget_recovery:
    type: linear
    soul_ref: budget-worker
workflow:
  name: terminal_block_cost_cap_preserves_paid_result
  entry: terminal_budget_block
  transitions:
    - from: terminal_budget_block
      to: null
    - from: fallback_budget_recovery
      to: null
