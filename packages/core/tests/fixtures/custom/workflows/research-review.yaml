version: '1.0'
id: research-review
kind: workflow
tools:
  - notification_payload_builder
  - notification_delivery_hook
souls:
  notification_dispatcher:
    id: notification_dispatcher
    kind: soul
    name: Notification Reporter
    role: Notification Reporter
    system_prompt: >
      Post the provided summary to the notification channel using the tools available to you.
      Use notification_payload_builder to format the message, then notification_delivery_hook to send it.
    tools:
      - notification_payload_builder
      - notification_delivery_hook
blocks:
  research:
    type: linear
    soul_ref: researcher
  write_summary:
    type: linear
    soul_ref: writer
  quality_review:
    type: gate
    soul_ref: reviewer
    eval_key: write_summary
  notify:
    type: linear
    soul_ref: notification_dispatcher
workflow:
  name: Research & Review
  entry: research
  transitions:
    - from: research
      to: write_summary
    - from: write_summary
      to: quality_review
    - from: quality_review
      to: notify
