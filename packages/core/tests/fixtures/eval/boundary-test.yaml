version: "1.0"
souls:
  default:
    id: default
    model: fixture-eval-model
    system_prompt: "Assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze."
workflow:
  name: boundary_test
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 0.5
  cases:
    - id: pass_case
      fixtures:
        analyze: "The LLM is great."
      expected:
        analyze:
          - type: contains
            value: "LLM"
    - id: fail_case
      fixtures:
        analyze: "Something completely unrelated."
      expected:
        analyze:
          - type: contains
            value: "XYZNONEXISTENT"
