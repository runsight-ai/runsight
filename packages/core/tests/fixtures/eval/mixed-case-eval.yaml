version: "1.0"
souls:
  default:
    id: default
    model: fixture-model
    system_prompt: "Assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze."
workflow:
  name: mixed_case_eval
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 0.6
  cases:
    - id: matching_fixture
      fixtures:
        analyze: "LLMs are powerful transformer models."
      expected:
        analyze:
          - type: contains
            value: "transformer"
    - id: missing_keyword
      fixtures:
        analyze: "The weather is sunny today."
      expected:
        analyze:
          - type: contains
            value: "absent keyword"
    - id: partial_threshold
      fixtures:
        analyze: "Neural networks use backpropagation for training."
      expected:
        analyze:
          - type: contains
            value: "backpropagation"
          - type: contains
            value: "missing value"
