version: "1.0"
souls:
  default:
    id: default
    model: fixture-model
    system_prompt: "Assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze."
workflow:
  name: unknown_transform_test
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 1.0
  cases:
    - id: unknown_transform
      fixtures:
        analyze: '{"data": "value"}'
      expected:
        analyze:
          - type: contains
            value: "value"
            transform: "xpath:$.data"
