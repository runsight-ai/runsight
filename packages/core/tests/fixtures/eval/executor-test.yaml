version: "1.0"
souls:
  default:
    id: default
    model: fixture-eval-model
    system_prompt: "You are an assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze: {topic}"
workflow:
  name: executor_test
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 0.8
  cases:
    - id: exec_case
      inputs:
        topic: "transformers"
      expected:
        analyze:
          - type: contains
            value: "transformer"
