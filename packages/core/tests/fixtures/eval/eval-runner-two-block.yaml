version: "1.0"
souls:
  default_soul:
    id: default_soul
    model: gpt-4o
    system_prompt: "You are a research assistant."
blocks:
  analyze:
    type: llm
    soul: default_soul
    prompt_template: "Analyze: {task_instruction}"
  summarize:
    type: llm
    soul: default_soul
    prompt_template: "Summarize the analysis."
workflow:
  name: eval_runner_workflow
  entry: analyze
  transitions:
    - from: analyze
      to: summarize
    - from: summarize
      to: END
eval:
  threshold: 0.8
  cases:
    - id: multi_block_case
      inputs:
        task_instruction: "Research LLMs"
      fixtures:
        analyze: "LLMs have revolutionized NLP tasks."
        summarize: "Summary: LLMs are transformative."
      expected:
        analyze:
          - type: contains
            value: "LLM"
        summarize:
          - type: contains
            value: "Summary"
