version: "1.0"
souls:
  default:
    id: default
    model: fixture-eval-model
    system_prompt: "Assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze."
workflow:
  name: mixed_test
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 0.8
  cases:
    - id: fixture_case
      fixtures:
        analyze: "The LLM results are promising."
      expected:
        analyze:
          - type: contains
            value: "LLM"
    - id: executor_case
      inputs:
        topic: "transformers"
      expected:
        analyze:
          - type: contains
            value: "transformer"
