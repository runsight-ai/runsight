version: "1.0"
souls:
  default:
    id: default
    model: fixture-model
    system_prompt: "Assistant."
blocks:
  analyze:
    type: llm
    soul: default
    prompt_template: "Analyze."
workflow:
  name: bad_transform_test
  entry: analyze
  transitions:
    - from: analyze
      to: END
eval:
  threshold: 1.0
  cases:
    - id: bad_transform
      fixtures:
        analyze: "This is plain text, definitely not JSON"
      expected:
        analyze:
          - type: contains
            value: "anything"
            transform: "json_path:$.field"
